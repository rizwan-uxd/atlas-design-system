name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: ["main"]

jobs:
  # ─── Shared setup ──────────────────────────────────────────────────────────
  setup:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

  # ─── TypeScript ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  # ─── TypeScript (native) ───────────────────────────────────────────────────
  # The root tsconfig excludes packages/ui-native, so it is checked on its own.
  typecheck-native:
    name: Typecheck (native)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit -p packages/ui-native

  # ─── ESLint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Blocking ratchet: existing errors are recorded in eslint-suppressions.json and the 7 current
      # warnings are capped, so only new problems fail. Fixing one makes its suppression stale and
      # fails the run until `npx eslint packages/ui-web/src --prune-suppressions` is committed.
      - run: npx eslint packages/ui-web/src/ --ext .ts,.tsx --max-warnings=7

  # ─── Token build (drift check) ─────────────────────────────────────────────
  tokens-build:
    name: Tokens Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/convert-tokens.mjs
      - name: Fail if generated output differs from committed file
        run: git diff --exit-code packages/ui-native/tokens/atlas.tokens.ts

  # ─── Token lint (no hardcoded values) ──────────────────────────────────────
  token-lint:
    name: Token Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node packages/governance/token-lint.mjs

  # ─── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test

  # ─── Figma Code Connect parse ──────────────────────────────────────────────
  figma-parse:
    name: Figma Code Connect Parse
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: >
          npx figma connect parse
          --config packages/figma-sync/mcp/configs/figma.config.json

  # ─── Atlas verify (design checks, scope, snapshot freshness) ───────────────
  # tsc, vitest and token-lint already run in their own jobs, so they are skipped here.
  # A PR that adds an approved component or token carries the `atlas-approved-new` label.
  atlas-verify:
    name: Atlas Verify
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Script tests
        run: npm run test:scripts
      # M3: stale facts, and any authored registry claim the code cannot back, fail here
      - name: Registry invariant
        run: npm run registry:check
      # A push to main has no PR labels in its event, so look up the merged PR of this commit.
      - name: Merged PR approved new components
        id: merged-label
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          approved=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq 'any(.[]; .merged_at != null and any(.labels[]; .name == "atlas-approved-new"))')
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
      - name: Atlas verify
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          ALLOW_NEW: ${{ ((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'atlas-approved-new')) || steps.merged-label.outputs.approved == 'true') && '--allow-new-component --allow-new-token' || '' }}
        # --max-figma-age makes a stale Figma side a FAILURE. 90 days is a policy choice, not a
        # technical limit: atlas-sync's carriedForward() rewrites the snapshot from itself when no
        # --pull is supplied, so without a gate "Figma wins" would mean "the last pull wins, forever,
        # undetectably". Raise or lower it freely; the failure message names the fix.
        run: npm run atlas:verify -- --base "$BASE" --skip tsc,tests,token-lint --max-figma-age 90 $ALLOW_NEW

  # ─── North-star metric manifest (Phase 4: collection + blocking staleness gate) ───
  # Every generator input is collected in-job into .metrics/, so the generated region is result-derived
  # and `metrics:check` (BLOCKING) fails a stale or hand-edited committed table the same way tokens-build
  # fails undiffed native output. To refresh the committed region: download this job's `metrics`
  # artifact, run `node scripts/metrics-report.mjs --results <artifact>/metrics-input`, commit.
  # A metric whose check did not run reads not measurable, never passing.
  metrics:
    name: Metric manifest
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      pull-requests: write # the totals comment; nothing else in this job writes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Collection steps are continue-on-error on purpose: a red check is an honest metric READING
      # (the region must show it failing), not a reason to skip the report. mkdir first: a shell
      # redirect into .metrics/ fails before anything creates the directory.
      - name: Prepare .metrics
        run: mkdir -p .metrics
      # Phase 6 (DEC-093, D1): bench rows read the last recorded protocol batch, committed by hand; CI never calls a model.
      - name: Collect the recorded protocol bench
        run: if [ -f benchmarks/results/protocol-latest/bench.json ]; then cp benchmarks/results/protocol-latest/bench.json .metrics/bench.json; fi
      - name: Collect atlas-verify results
        continue-on-error: true
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        # node directly, not npm run: npm's "> package@script" banner would land in the JSON file
        run: node scripts/atlas-verify.mjs --base "$BASE" --skip tsc,tests,token-lint --max-figma-age 90 --json > .metrics/atlas-verify.json
      - name: Collect vitest results
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile .metrics/vitest.json
      # Report-only metric tests (*.metric.tsx, vitest.metrics.config.ts), such as the protocol size
      # ratio (DEC-085). Their JSON lands in .metrics/vitest-metrics.json, read as vitest results.
      - name: Report-only metric tests (non-blocking)
        continue-on-error: true
        run: npm run test:metrics
      # Both Playwright projects (visual + runtime-demo); the webServer builds the app in CI mode.
      # Failures stay in the report: a failing screenshot is a metric reading, not a broken job.
      - name: Collect Playwright results
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=json > .metrics/playwright.json
      # Artifact + report first (they must exist even when the gate below fails), then the gate.
      # metrics-report rewrites the roadmap region in this workspace, so the gate restores the
      # COMMITTED file first: it must compare the committed region against a fresh run, never fresh
      # output against itself (that order cannot fail, which is the bug this exists to prevent).
      # The copy exists because artifact globs skip dot-directories.
      - name: Stage the collected inputs
        run: cp -r .metrics metrics-input
      - name: Generate atlas-report.json
        run: node scripts/metrics-report.mjs
      - name: Upload metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            metrics-input/
            atlas-report.json
      - name: Comment the metric totals on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          TOTALS=$(node -e "const r=require('./atlas-report.json');const t=r.totals;console.log(t.passing+' passing · '+t.failing+' failing · '+t.notMeasurable+' not measurable of '+t.total)")
          gh pr comment "$PR" --body "Metrics: $TOTALS. Full table: the \`metrics\` artifact (atlas-report.json) and the generated region in docs/ATLAS-DELIVERY-ROADMAP.md."
      - name: Committed metric region is current (blocking)
        run: |
          git checkout -- docs/ATLAS-DELIVERY-ROADMAP.md
          npm run metrics:check

  # ─── ui-native freeze (roadmap R3: freeze rather than absorb) ──────────────
  # Native ports are paused by the owner. Any diff under packages/ui-native fails unless the PR
  # carries the atlas-native-thaw label — the owner's gate, the same mechanism as
  # atlas-approved-new. ui-native stays out of atlas-verify's SCAN_DIRS on purpose.
  native-freeze:
    name: Native freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merged PR thawed native
        id: merged-thaw
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          thawed=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq 'any(.[]; .merged_at != null and any(.labels[]; .name == "atlas-native-thaw"))')
          echo "thawed=$thawed" >> "$GITHUB_OUTPUT"
      - name: Fail on any ui-native diff without the thaw label
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          THAWED: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'atlas-native-thaw')) || steps.merged-thaw.outputs.thawed == 'true' }}
        run: |
          CHANGED=$(git diff --name-only "$BASE" -- packages/ui-native)
          if [ -n "$CHANGED" ] && [ "$THAWED" != "true" ]; then
            echo "::error::packages/ui-native is frozen (ports paused by the owner; roadmap R3). Thaw with the atlas-native-thaw label. Changed: $CHANGED"
            exit 1
          fi
          echo "ui-native untouched (or thawed=$THAWED)"

  # ─── Runtime (M4): registry lookups, validator, reducer, renderer and seeded fuzz ───
  runtime:
    name: Runtime
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx vitest run packages/registry packages/runtime

  # ─── Visual regression (sandbox sections, light + dark) ────────────────────
  # Baselines are linux screenshots made by the "Visual baseline" workflow and committed under
  # tests/visual/. Until they exist this job is skipped.
  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - id: baselines
        run: echo "found=$(ls tests/visual/*-snapshots/*-linux.png 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - if: steps.baselines.outputs.found != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.baselines.outputs.found != '0'
        run: npm ci --legacy-peer-deps
      - if: steps.baselines.outputs.found != '0'
        run: npx playwright install --with-deps chromium
      - if: steps.baselines.outputs.found != '0'
        # Both Playwright projects in one invocation, so the production build runs once: chromium (visual
        # regression) and runtime-demo (the M4 runtime metrics, DEC-084 (7)).
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
