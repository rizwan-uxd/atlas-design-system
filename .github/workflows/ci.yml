name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: ["main"]

jobs:
  # ─── Shared setup ──────────────────────────────────────────────────────────
  setup:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

  # ─── TypeScript ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  # ─── TypeScript (native) ───────────────────────────────────────────────────
  # The root tsconfig excludes packages/ui-native, so it is checked on its own.
  typecheck-native:
    name: Typecheck (native)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit -p packages/ui-native

  # ─── ESLint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Blocking ratchet: existing errors are recorded in eslint-suppressions.json and the 7 current
      # warnings are capped, so only new problems fail. Fixing one makes its suppression stale and
      # fails the run until `npx eslint packages/ui-web/src --prune-suppressions` is committed.
      - run: npx eslint packages/ui-web/src/ --ext .ts,.tsx --max-warnings=7

  # ─── Token build (drift check) ─────────────────────────────────────────────
  tokens-build:
    name: Tokens Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/convert-tokens.mjs
      - name: Fail if generated output differs from committed file
        run: git diff --exit-code packages/ui-native/tokens/atlas.tokens.ts

  # ─── Token lint (no hardcoded values) ──────────────────────────────────────
  token-lint:
    name: Token Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node packages/governance/token-lint.mjs

  # ─── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test

  # ─── Figma Code Connect parse ──────────────────────────────────────────────
  figma-parse:
    name: Figma Code Connect Parse
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: >
          npx figma connect parse
          --config packages/figma-sync/mcp/configs/figma.config.json

  # ─── Atlas verify (design checks, scope, snapshot freshness) ───────────────
  # tsc, vitest and token-lint already run in their own jobs, so they are skipped here.
  # A PR that adds an approved component or token carries the `atlas-approved-new` label.
  atlas-verify:
    name: Atlas Verify
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Script tests
        run: npm run test:scripts
      # M3: stale facts, and any authored registry claim the code cannot back, fail here
      - name: Registry invariant
        run: npm run registry:check
      # A push to main has no PR labels in its event, so look up the merged PR of this commit.
      - name: Merged PR approved new components
        id: merged-label
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          approved=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq 'any(.[]; .merged_at != null and any(.labels[]; .name == "atlas-approved-new"))')
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
      - name: Atlas verify
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          ALLOW_NEW: ${{ ((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'atlas-approved-new')) || steps.merged-label.outputs.approved == 'true') && '--allow-new-component --allow-new-token' || '' }}
        # --max-figma-age makes a stale Figma side a FAILURE. 90 days is a policy choice, not a
        # technical limit: atlas-sync's carriedForward() rewrites the snapshot from itself when no
        # --pull is supplied, so without a gate "Figma wins" would mean "the last pull wins, forever,
        # undetectably". Raise or lower it freely; the failure message names the fix.
        run: npm run atlas:verify -- --base "$BASE" --skip tsc,tests,token-lint --max-figma-age 90 $ALLOW_NEW

  # ─── North-star metric manifest ───────────────────────────────────────────
  # Phase 1 scope (docs/ATLAS-DELIVERY-ROADMAP.md): this gates TOTALITY only — every metric the spec
  # names must appear in metrics.manifest.json, so a metric cannot be quietly dropped once it goes red.
  # It does NOT yet gate staleness of the generated region in the roadmap: that needs the atlas-verify
  # and vitest JSON collected as artifacts. Phase 4 adds that collection and switches this job to
  # `npm run metrics:check`. Until then staleness is caught by `npm run metrics:check` locally and by
  # scripts/tests/metrics-report.test.mjs, which the test:scripts job already runs.
  metrics:
    name: Metric manifest
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Manifest covers every spec metric
        run: node scripts/metrics-report.mjs --json > /dev/null
      # Report-only metric tests (*.metric.tsx, vitest.metrics.config.ts), such as the protocol size ratio. A
      # failure is an honest metric reading, not a broken build, so this step never fails the job (owner decision
      # 2026-10-23). Its JSON lands in .metrics/vitest-metrics.json, which metrics-report reads as vitest results.
      - name: Report-only metric tests (non-blocking)
        continue-on-error: true
        run: npm run test:metrics

  # ─── Visual regression (sandbox sections, light + dark) ────────────────────
  # Baselines are linux screenshots made by the "Visual baseline" workflow and committed under
  # tests/visual/. Until they exist this job is skipped.
  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - id: baselines
        run: echo "found=$(ls tests/visual/*-snapshots/*-linux.png 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - if: steps.baselines.outputs.found != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.baselines.outputs.found != '0'
        run: npm ci --legacy-peer-deps
      - if: steps.baselines.outputs.found != '0'
        run: npx playwright install --with-deps chromium
      - if: steps.baselines.outputs.found != '0'
        run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
