name: Visual baseline

# Manual: regenerates the linux screenshot baselines and opens a PR with them against the branch
# it was run on. Run it after an intended visual change, then review the images in the PR.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  baseline:
    name: Update baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Open a PR with the new baselines
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          git add tests/visual
          if git diff --cached --quiet; then echo "no baseline changes"; exit 0; fi
          BRANCH="visual-baseline/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "test(visual): update linux baselines"
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "test(visual): update linux baselines" \
            --body "Generated by the Visual baseline workflow (run ${GITHUB_RUN_ID}). Review the changed images before merging."
