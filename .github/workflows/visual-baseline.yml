name: Visual baseline

# Manual: regenerates the linux screenshot baselines and commits them to the selected branch.
# Run it after an intended visual change (check the diff in the commit before merging).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    name: Update baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          git diff --cached --quiet && echo "no baseline changes" || git commit -m "test(visual): update linux baselines" && git push
